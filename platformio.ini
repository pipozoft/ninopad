; PlatformIO project for NinoPad (ESP32 + 4" TFT ST7796 480x320 + XPT2046 resistive touch)
; LVGL v9 + Arduino_GFX. FT6236 capacitive driver included as optional stub.
;
; Two board targets:
;   esp32    — standard ESP32 (ESP-WROOM-32, DevKitC, NodeMCU-32S, etc.)
;   esp32s3  — ESP32-S3 (DevKitC-1-N16R8 with PSRAM)
;
; Flash via:  pio run -e esp32 -t upload

[platformio]
default_envs = esp32

; ===== Standard ESP32 (XTensa LX6, 240MHz, 4MB Flash, no PSRAM typical) =====
[env:esp32]
platform          = espressif32
board             = esp32dev
framework         = arduino
board_build.f_cpu = 240000000L
upload_speed      = 115200
monitor_speed     = 115200
monitor_filters   = esp32_exception_decoder, time

extra_scripts     = pre:tools/pio_strip_helium.py

build_flags =
  -I$PROJECT_DIR
  -I$PROJECT_DIR/src
  -I$PROJECT_DIR/src/ui
  -I$PROJECT_DIR/src/ui/apps
  -I$PROJECT_DIR/src/ui/screens
  -I$PROJECT_DIR/src/ui/icons
  -I$PROJECT_DIR/src/utils
  -I$PROJECT_DIR/src/storage
  -I$PROJECT_DIR/src/hal
  -DNINO_TOUCH_XPT2046
  -DNINO_LOG_TAG="NinoPad"

lib_deps =
  lvgl/lvgl @ ^9.2.0
  moononournation/GFX Library for Arduino @ ~1.3.3
  bblanchon/ArduinoJson @ ^7.1.0

lib_archive = no
lib_ldf_mode = chain+

; ===== ESP32-S3 (XTensa LX7, 240MHz, PSRAM enabled, USB CDC) =====
[env:esp32s3]
platform          = espressif32
board             = esp32-s3-devkitc-1
framework         = arduino
board_build.f_cpu = 240000000L
upload_speed      = 921600
monitor_speed     = 115200
monitor_filters   = esp32_exception_decoder, time

extra_scripts     = pre:tools/pio_strip_helium.py

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -I$PROJECT_DIR
  -I$PROJECT_DIR/src
  -I$PROJECT_DIR/src/ui
  -I$PROJECT_DIR/src/ui/apps
  -I$PROJECT_DIR/src/ui/screens
  -I$PROJECT_DIR/src/ui/icons
  -I$PROJECT_DIR/src/utils
  -I$PROJECT_DIR/src/storage
  -I$PROJECT_DIR/src/hal
  -DNINO_TOUCH_XPT2046
  -DNINO_LOG_TAG="NinoPad"

lib_deps =
  lvgl/lvgl @ ^9.2.0
  moononournation/GFX Library for Arduino @ ~1.6.6
  bblanchon/ArduinoJson @ ^7.1.0

lib_archive = no
lib_ldf_mode = chain+